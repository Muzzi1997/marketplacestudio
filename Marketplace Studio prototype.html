<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marketplace Studio prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F4F3;--surface:#FFFFFF;--sunk:#E9EDEB;--ink:#17252B;--ink-2:#46565D;--ink-3:#76858B;
  --line:#DAE0DE;--line-2:#C3CCC9;--rail:#1B2A30;--rail-2:#24363D;--rail-ink:#C4CFCE;--rail-ink-2:#7F9195;
  --accent:#F2B705;--accent-ink:#1B2A30;--link:#1F5D86;--ok:#2B7A4B;--ok-bg:#E3F1E8;--warn:#9A6410;--warn-bg:#FBF0DA;
  --err:#B3261E;--err-bg:#F9E3E1;--info:#2F6690;--info-bg:#E2EDF5;--sandbox:#E8890C;--sandbox-bg:#FFF3E0;
  --brand:#1D6B55;--focus:0 0 0 3px rgba(242,183,5,.55);
  --font:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F171A;--surface:#162126;--sunk:#111B1F;--ink:#E4EBE9;--ink-2:#A9B6B5;--ink-3:#7C8B8D;--line:#24343A;--line-2:#33454C;
  --rail:#0B1215;--rail-2:#16242A;--rail-ink:#C4CFCE;--rail-ink-2:#6F8286;--link:#86BDE4;--ok:#6CC892;--ok-bg:#16301F;--warn:#E8B15A;--warn-bg:#33270F;
  --err:#F08A80;--err-bg:#3A1714;--info:#8CC0E6;--info-bg:#132A3A;--sandbox:#F2A23C;--sandbox-bg:#2E2010;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F171A;--surface:#162126;--sunk:#111B1F;--ink:#E4EBE9;--ink-2:#A9B6B5;--ink-3:#7C8B8D;--line:#24343A;--line-2:#33454C;
  --rail:#0B1215;--rail-2:#16242A;--rail-ink:#C4CFCE;--rail-ink-2:#6F8286;--link:#86BDE4;--ok:#6CC892;--ok-bg:#16301F;--warn:#E8B15A;--warn-bg:#33270F;
  --err:#F08A80;--err-bg:#3A1714;--info:#8CC0E6;--info-bg:#132A3A;--sandbox:#F2A23C;--sandbox-bg:#2E2010;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
svg[aria-hidden="true"]{width:18px;height:18px;flex:none}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#26343A}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:4px}
h1,h2,h3,h4{font-stretch:82%;margin:0;line-height:1.15;letter-spacing:-.005em}
h1{font-size:26px;font-weight:720}h2{font-size:19px;font-weight:700}h3{font-size:15px;font-weight:680;font-stretch:90%}h4{font-size:13px;font-weight:650;font-stretch:95%}
p{margin:0 0 .6em}small,.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Prototype bar */
#proto{display:flex;align-items:center;gap:14px;height:40px;padding:0 12px;background:#26343A;color:#DDE5E4;font-size:12.5px;position:sticky;top:0;z-index:50;overflow-x:auto;white-space:nowrap}
#proto .tag{font-weight:700;color:var(--accent);font-stretch:85%;font-size:13px}
#proto select{background:#33454C;border:1px solid #435860;border-radius:4px;color:#fff;padding:3px 6px}
#proto .seg{display:inline-flex;border:1px solid #435860;border-radius:4px;overflow:hidden}
#proto .seg button{background:none;border:0;color:#C9D3D2;padding:4px 9px;cursor:pointer}
#proto .seg button[aria-pressed="true"]{background:var(--accent);color:#1B2A30;font-weight:650}
#proto .pbtn{background:#33454C;border:1px solid #435860;color:#fff;border-radius:4px;padding:4px 10px;cursor:pointer}
#proto .pbtn.hot{background:var(--accent);border-color:var(--accent);color:#1B2A30;font-weight:650}
#proto .sp{flex:1}

/* App shell */
#app{height:calc(100% - 40px);display:grid;grid-template-rows:52px 1fr;position:relative}
#app.sandbox::after{content:"";position:fixed;inset:40px 0 0 0;border:3px solid var(--sandbox);pointer-events:none;z-index:40}
.top{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .brand{display:flex;align-items:center;gap:10px;min-width:222px}
.top .mark{width:26px;height:26px;border-radius:5px;background:var(--rail);display:grid;place-items:center}
.top .mark svg{width:16px;height:16px}
.top .ttl{font-weight:720;font-stretch:80%;font-size:16px}
.top .tenant{color:var(--ink-3);font-size:13px}
.env{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:20px;padding:3px 10px 3px 8px;font-size:12.5px;font-weight:600;background:var(--surface);cursor:pointer}
.env i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.env.sb{border-color:var(--sandbox);background:var(--sandbox-bg);color:var(--sandbox)}.env.sb i{background:var(--sandbox)}
.cs{font-size:12.5px;border:0;background:none;color:var(--link);cursor:pointer;padding:4px 6px;font-weight:600}
.cs b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);margin-right:6px;font-size:11.5px}
.search{flex:1;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;border:1px solid var(--line-2);background:var(--bg);border-radius:6px;padding:7px 10px 7px 32px}
.search svg{position:absolute;left:9px;top:8px;width:16px;height:16px;color:var(--ink-3)}
.sres{position:absolute;top:38px;left:0;right:0;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:30;max-height:340px;overflow:auto}
.sres a{display:block;padding:8px 12px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.sres a:hover,.sres a:focus{background:var(--sunk)}
.sres small{display:block}
.iconbtn{border:0;background:none;width:34px;height:34px;border-radius:6px;display:grid;place-items:center;color:var(--ink-2);cursor:pointer}
.iconbtn:hover{background:var(--sunk)}.iconbtn svg{width:18px;height:18px}
.user{display:flex;align-items:center;gap:8px;font-size:13px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--sunk);color:var(--ink-2);border:1px solid var(--line-2);flex:none}
.body{display:grid;grid-template-columns:236px 1fr;min-height:0}
.rail{background:var(--rail);color:var(--rail-ink);overflow-y:auto;padding:10px 0 30px}
.rail .grp{margin-top:14px;padding:0 18px 4px;color:var(--rail-ink-2);font-size:12px;font-weight:600}
.rail a{display:flex;align-items:center;gap:10px;padding:7px 18px;color:var(--rail-ink);text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
.rail a:hover{background:var(--rail-2)}
.rail a.on{background:var(--rail-2);border-left-color:var(--accent);color:#fff;font-weight:600}
.rail a svg{width:17px;height:17px;flex:none;opacity:.85}
.rail a .rel{margin-left:auto}
.rail a.off{opacity:.55}
main{overflow:auto;min-width:0;display:flex;flex-direction:column}
.phead{padding:18px 28px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.crumbs{font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.crumbs a{color:var(--ink-3);text-decoration:none}.crumbs a:hover{color:var(--link);text-decoration:underline}
.ptitle{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:14px}
.ptitle h1{flex:1;min-width:200px}
.ptitle .sub{display:block;font-size:13.5px;font-weight:400;color:var(--ink-2);font-stretch:100%;margin-top:6px;max-width:72ch;letter-spacing:0}
.ptitle .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:2px;overflow-x:auto;margin:0 -4px}
.tabs a{padding:9px 12px 10px;text-decoration:none;color:var(--ink-2);font-size:13.5px;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs a.on{color:var(--ink);font-weight:650;border-bottom-color:var(--accent)}
.tabs a.off{color:var(--ink-3)}
.content{padding:22px 28px 90px;flex:1}
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.split.wide{grid-template-columns:minmax(0,1fr) 460px}
.sticky{position:sticky;top:0}
.ro-banner{display:flex;gap:8px;align-items:center;background:var(--info-bg);color:var(--info);padding:8px 12px;border-radius:6px;margin-bottom:16px;font-size:13px}
.ro .mut{display:none!important}

/* Generic components */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:5px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.pri:hover{filter:brightness(1.15)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dng{color:var(--err);border-color:currentColor;background:none}
.btn.ghost{border-color:transparent;background:none;color:var(--link);padding:6px 8px}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.panel>.ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel>.ph h3{flex:1}
.panel>.pb{padding:14px 16px}
.panel+.panel{margin-top:16px}
.empty{padding:36px 20px;text-align:center;color:var(--ink-2)}
.empty h3{margin-bottom:6px;color:var(--ink)}
.empty p{max-width:52ch;margin:0 auto 14px}
.rel{display:inline-block;font-size:10.5px;font-weight:650;padding:1px 6px;border-radius:3px;border:1px solid var(--line-2);color:var(--ink-3);line-height:16px;vertical-align:1px;font-stretch:90%;white-space:nowrap}
.rel-P1{color:var(--info);border-color:currentColor}.rel-P2{color:#7A4FA0;border-color:currentColor}
.rail .rel{color:var(--rail-ink-2);border-color:#3A4E55}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:12px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.err{background:var(--err-bg);color:var(--err)}.chip.info{background:var(--info-bg);color:var(--info)}.chip.sb{background:var(--sandbox-bg);color:var(--sandbox)}
.chip.plain::before{display:none}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--sunk);color:var(--ink-2)}
.tag.inh{background:var(--info-bg);color:var(--info)}.tag.prt{background:#EFE6F7;color:#6B3F94}.tag.op{background:var(--warn-bg);color:var(--warn)}
.lock{display:inline-flex;align-items:center;gap:4px;color:var(--ink-3);font-size:12px}.lock svg{width:13px;height:13px}
table.t{width:100%;border-collapse:collapse;background:var(--surface);font-size:13.5px}
.tw{border:1px solid var(--line);border-radius:6px;overflow-x:auto;background:var(--surface)}
table.t th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--sunk)}
table.t td.n,table.t th.n{text-align:right}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .grow{flex:1}
.fld{display:grid;gap:4px;margin-bottom:14px}
.fld>label,.fld>.lbl{font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.fld .help{font-size:12.5px;color:var(--ink-3)}
.fld .err{font-size:12.5px;color:var(--err)}
.in,select.in,textarea.in{border:1px solid var(--line-2);background:var(--surface);border-radius:5px;padding:7px 9px;width:100%;min-width:0}
textarea.in{min-height:80px;resize:vertical}
.in:disabled{background:var(--sunk);color:var(--ink-3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}
.sw{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-weight:500}
.sw input{position:absolute;opacity:0;width:36px;height:20px;margin:0;cursor:pointer}
.sw span.k{width:36px;height:20px;border-radius:10px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.sw span.k::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+span.k{background:var(--ok)}
.sw input:checked+span.k::after{left:18px}
.sw input:focus-visible+span.k{box-shadow:var(--focus)}
.sw input:disabled+span.k{opacity:.5}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.checks label{display:flex;gap:6px;align-items:center;font-weight:500}
.segc{display:inline-flex;border:1px solid var(--line-2);border-radius:5px;overflow:hidden;background:var(--surface)}
.segc button{border:0;background:none;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--ink-2);border-right:1px solid var(--line)}
.segc button:last-child{border-right:0}
.segc button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.lt{display:inline-flex;gap:2px;margin-left:auto}
.lt button{border:1px solid var(--line-2);background:var(--surface);font-size:11px;padding:1px 6px;border-radius:3px;cursor:pointer;color:var(--ink-2);position:relative}
.lt button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lt button.miss::after{content:"";position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--warn);border:1px solid var(--surface)}
.fsec{margin-bottom:26px}
.fsec>h3{margin-bottom:4px}
.fsec>.sh{color:var(--ink-3);font-size:13px;margin-bottom:14px;max-width:72ch}
.fsec .box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px 4px}
.reset{border:0;background:none;color:var(--ink-3);font-size:12px;cursor:pointer;text-decoration:underline;margin-left:auto}
.savebar{position:sticky;bottom:0;margin:20px -28px -90px;padding:12px 28px;background:var(--surface);border-top:2px solid var(--accent);display:flex;gap:10px;align-items:center;z-index:5}
.savebar .grow{flex:1;font-weight:600}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:14px;align-items:flex-start}
.note svg{width:17px;height:17px;flex:none;margin-top:1px}
.note.info{background:var(--info-bg);color:var(--info)}.note.warn{background:var(--warn-bg);color:var(--warn)}.note.err{background:var(--err-bg);color:var(--err)}.note.ok{background:var(--ok-bg);color:var(--ok)}
.note b{color:inherit}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;font-size:13.5px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink-2);border-radius:4px}
.bar.hot>i{background:var(--accent)}.bar.w>i{background:var(--warn)}.bar.e>i{background:var(--err)}

/* Home */
.home{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.home .c8{grid-column:span 8}.home .c4{grid-column:span 4}.home .c6{grid-column:span 6}.home .c12{grid-column:span 12}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:0}
.sn{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;color:var(--ink-3)}
.sn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.sn.cur{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 3px var(--accent)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13px}
.feed li:last-child{border:0}
.qlinks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qlinks a{padding:10px 12px;border:1px solid var(--line);border-radius:5px;text-decoration:none;color:var(--ink);font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.qlinks a:hover{border-color:var(--ink-2)}
.qlinks svg{width:16px;height:16px;color:var(--ink-3)}
.big{font-size:30px;font-weight:720;font-stretch:78%;line-height:1}

/* Tree */
.tree{font-size:13.5px;user-select:none}
.tree ul{list-style:none;margin:0;padding:0 0 0 18px}
.tree>ul{padding:0}
.tn{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:4px;cursor:pointer;border:1px solid transparent}
.tn:hover{background:var(--sunk)}
.tn.sel{background:var(--info-bg);border-color:var(--info)}
.tn.inactive .nm{color:var(--ink-3);text-decoration:line-through}
.tn .tw2{width:16px;height:16px;border:0;background:none;padding:0;cursor:pointer;color:var(--ink-3);display:grid;place-items:center}
.tn .tw2 svg{width:12px;height:12px;transition:transform .12s}
.tn .tw2.open svg{transform:rotate(90deg)}
.tn .lvl{font-size:11px;color:var(--ink-3)}
.tn .cnt{margin-left:auto;font-size:12px;color:var(--ink-3)}
.tn.drop{outline:2px dashed var(--accent)}
.tn .drag{cursor:grab;color:var(--ink-3);opacity:0}
.tn:hover .drag{opacity:1}
.tn input{border:1px solid var(--ink-2);padding:2px 5px;border-radius:3px;width:200px}

/* Builder */
.builder{display:grid;grid-template-columns:270px minmax(0,1fr) 320px;gap:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-height:640px}
.builder>div{min-width:0}
.b-left{border-right:1px solid var(--line);overflow:auto;max-height:78vh}
.b-right{border-left:1px solid var(--line);overflow:auto;max-height:78vh}
.b-mid{background:var(--sunk);overflow:auto;max-height:78vh}
.b-hd{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;font-weight:650;font-size:13px;background:var(--surface);position:sticky;top:0;z-index:2}
.ol .osec{padding:8px 12px 4px;font-weight:650;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer}
.ol .ofld{padding:5px 12px 5px 26px;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;border-left:3px solid transparent}
.ol .ofld:hover,.ol .osec:hover{background:var(--sunk)}
.ol .sel{background:var(--info-bg);border-left-color:var(--info)}
.ol .ofld .tag{margin-left:auto}
.ol .hid{color:var(--ink-3);font-style:italic}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px}
.pal button{border:1px dashed var(--line-2);background:var(--surface);border-radius:4px;padding:6px;font-size:12px;text-align:left;cursor:grab;color:var(--ink-2)}
.pal button:hover{border-color:var(--ink-2);color:var(--ink)}
.pal h4{grid-column:1/-1;margin-top:6px;color:var(--ink-3);font-weight:600}
.canvas{margin:18px auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 22px;transition:max-width .2s}
.canvas.desktop{max-width:720px}.canvas.mobile{max-width:380px}
.cv-sec{margin-bottom:18px;border:1px solid transparent;border-radius:5px;padding:6px}
.cv-sec.sel,.cv-f.sel{outline:2px solid var(--accent);outline-offset:2px}
.cv-sec h3{margin-bottom:10px;display:flex;gap:8px;align-items:center}
.cv-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.canvas.mobile .cv-grid{grid-template-columns:1fr}
.cv-f{padding:4px;border-radius:4px;cursor:pointer}
.cv-f:hover{background:var(--sunk)}
.cv-f .lbl{font-size:12.5px;font-weight:600;margin-bottom:3px;display:flex;gap:6px;align-items:center}
.cv-f .req{color:var(--err)}
.cv-f .val{font-size:13.5px}
.cv-f .fake{border:1px solid var(--line-2);border-radius:4px;padding:6px 8px;color:var(--ink-3);font-size:13px;background:var(--surface);min-height:33px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cv-f.wide{grid-column:1/-1}
.photo-slots{display:flex;gap:6px;flex-wrap:wrap}
.photo-slots div{width:84px;height:62px;border:1.5px dashed var(--line-2);border-radius:4px;display:grid;place-items:center;font-size:10.5px;color:var(--ink-3);text-align:center;padding:3px}
.props{padding:12px 14px}
.props .fld{margin-bottom:11px}

/* Matrix */
.mx{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:6px 8px;background:var(--surface)}
.mx thead th{position:sticky;top:0;z-index:1;background:var(--sunk);font-weight:600;font-size:12px;vertical-align:bottom;text-align:left}
.mx th.rowh{text-align:left;font-weight:500;white-space:nowrap;position:sticky;left:0;z-index:1}
.mx tr.sec th.rowh{font-weight:680}
.mx tr.sec td,.mx tr.sec th{background:var(--sunk)}
.mx select{border:1px solid var(--line-2);border-radius:4px;padding:3px 4px;font-size:12.5px;width:96px;background:var(--surface)}
.mx select.H{color:var(--ink-3)}.mx select.V{color:var(--info)}.mx select.E{color:var(--ink)}.mx select.R{color:var(--err);font-weight:650}
.mx .ovr{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:middle}
.mx td{white-space:nowrap}.mx td.c{text-align:center}
.mx td.dis{opacity:.45}
.colbulk{display:block;margin-top:4px}
.colbulk select{width:96px;font-size:11.5px}

/* Dialog */
dialog{border:0;border-radius:8px;padding:0;max-width:min(620px,94vw);width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(15,23,26,.45)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.dh h2{flex:1}
.db{padding:18px 20px;max-height:66vh;overflow:auto}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--sunk);border-radius:0 0 8px 8px}
.impact{display:flex;gap:14px;align-items:flex-start}
.impact .num{font-size:34px;font-weight:760;font-stretch:76%;color:var(--warn);line-height:1}

/* Toast */
#toasts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:100}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:6px;font-size:13.5px;box-shadow:0 8px 20px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:tin .18s ease-out}
.toast.err{background:var(--err);color:#fff}
.toast a{color:var(--accent);font-weight:650}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* Flow guide */
#guide{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:340px;max-height:70vh;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.22);z-index:45;display:flex;flex-direction:column}
#guide[hidden]{display:none}
#guide .gh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--rail);color:#fff;border-radius:8px 8px 0 0}
#guide .gh h3{flex:1;font-size:14px}
#guide .gh .iconbtn{color:#fff;width:28px;height:28px}
#guide .gb{overflow:auto;padding:8px 0}
#guide .fl{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
#guide .fl:hover{background:var(--sunk)}
#guide .fl b{display:block;font-size:13.5px}
#guide .fl small{font-size:12px}
#guide ol{margin:0;padding:6px 14px 6px 14px;list-style:none;counter-reset:g}
#guide ol li{counter-increment:g;display:grid;grid-template-columns:24px 1fr;gap:8px;padding:6px 0;font-size:13px;align-items:start}
#guide ol li::before{content:counter(g);width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-3)}
#guide ol li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#fff}
#guide ol li.cur::before{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 3px var(--accent)}
#guide ol li.done span{color:var(--ink-3)}
#guide ol li a{font-size:12px;margin-left:6px}

/* Phone + previews */
.phone{width:290px;height:590px;border:10px solid #1B2A30;border-radius:34px;background:#fff;color:#17252B;overflow:hidden;margin:0 auto;display:flex;flex-direction:column;position:relative;font-size:12.5px}
.phone .notch{height:22px;display:flex;justify-content:space-between;padding:4px 16px 0;font-size:10.5px;font-weight:650;color:#17252B}
.phone .scr{flex:1;overflow:auto;padding:8px 12px}
.phone .tb{display:flex;border-top:1px solid #DCE2E0;background:#fff}
.phone .tb div{flex:1;text-align:center;padding:6px 0 10px;font-size:10px;color:#76858B}
.phone .tb div i{display:block;width:18px;height:18px;margin:0 auto 2px;border-radius:5px;background:#DCE2E0}
.phone .tb div.on{color:var(--brand);font-weight:700}
.phone .tb div.on i{background:var(--brand)}
.phone .blk{border:1px solid #DCE2E0;border-radius:8px;padding:8px;margin-bottom:8px;background:#fff}
.phone .blk h5{margin:0 0 6px;font-size:11.5px}
.phone .pill{display:inline-block;padding:2px 8px;border-radius:10px;background:#EEF1F0;margin:2px;font-size:10.5px}
.phone .btnb{display:block;text-align:center;padding:8px;border-radius:8px;color:#fff;background:var(--brand);font-weight:650;margin-bottom:6px}
.phone .wid{border-radius:8px;padding:8px;margin-bottom:8px;background:#F2F4F3}
.mini-site{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;color:#17252B}
.mini-site .nav{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #E3E8E6}
.mini-site .nav .lg{font-weight:800;font-stretch:80%;font-size:15px}
.mini-site .nav span{font-size:12px;color:#46565D}
.mini-site .hero{padding:22px 16px;color:#fff;background:var(--brand)}
.mini-site .hero h2{font-size:20px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
.lcard{border:1px solid #DCE2E0;border-radius:6px;overflow:hidden;font-size:12px;background:#fff;color:#17252B}
.lcard .img{height:74px;background:linear-gradient(135deg,#C9D2CF,#E8ECEA);display:grid;place-items:end start;padding:5px}
.lcard .img svg{width:58px;height:34px;opacity:.55}
.lcard .b{padding:7px 8px}
.lcard .b b{display:block;font-size:12.5px;line-height:1.25}
.lcard .pr{font-weight:750;margin-top:4px}
.lcard .ws{font-size:11px;color:#2B7A4B;font-weight:600}
.lcard .badges{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.lcard .bdg{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:3px;background:#E3F1E8;color:#2B7A4B}
.lcard .bdg.c{background:#FFF3C4;color:#7A5A00}
.mail{border:1px solid var(--line);border-radius:6px;background:#fff;color:#17252B;font-size:13px;overflow:hidden}
.mail .mh{padding:12px 16px;background:var(--brand);color:#fff;font-weight:750}
.mail .mb{padding:14px 16px}
.mail .mf{padding:10px 16px;font-size:11px;color:#76858B;border-top:1px solid #E3E8E6}
.mail .cta{display:inline-block;background:var(--brand);color:#fff;padding:7px 12px;border-radius:5px;font-weight:650;margin:6px 0}
.pdf{border:1px solid var(--line);background:#fff;color:#17252B;aspect-ratio:1/1.32;padding:16px;font-size:10.5px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.pdf .ph2{display:flex;justify-content:space-between;border-bottom:3px solid var(--brand);padding-bottom:6px;margin-bottom:8px;font-weight:800}
.swatch{width:34px;height:34px;border-radius:6px;border:1px solid var(--line-2);flex:none}
.contrast{font-size:12px;display:flex;gap:6px;align-items:center}
.qr{width:150px;height:150px;image-rendering:pixelated;margin:0 auto;display:block;background:#fff;padding:8px;border:1px solid var(--line)}

/* Diff */
.diff{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:13px}
.diff>div{padding:8px 12px;border-bottom:1px solid var(--line)}
.diff .bf{background:var(--err-bg)}.diff .af{background:var(--ok-bg)}
.diff .hd{background:var(--sunk);font-weight:600;font-size:12px}
.cg{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:12px}
.cg .cgh{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.cg .cgh b{flex:1}
.cg .cgb{padding:12px 14px}

/* Wizard */
.wz{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
.wzs{list-style:none;margin:0;padding:0;position:sticky;top:0}
.wzs li a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:5px;text-decoration:none;color:var(--ink-2);font-size:13.5px}
.wzs li a:hover{background:var(--sunk)}
.wzs li a.on{background:var(--surface);color:var(--ink);font-weight:650;border:1px solid var(--line)}
.wzb{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.wzb .wh{padding:18px 22px;border-bottom:1px solid var(--line)}
.wzb .wbody{padding:20px 22px}
.wzb .wf{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.wzb .wf .grow{flex:1}
.ck{list-style:none;margin:0;padding:0}
.ck li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.ck li:last-child{border:0}
.ck .ic{width:20px;height:20px;flex:none;margin-top:1px}
.ck li .grow{flex:1}
.prog{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.drop{border:2px dashed var(--line-2);border-radius:8px;padding:26px;text-align:center;color:var(--ink-2);cursor:pointer;background:var(--surface)}
.drop:hover{border-color:var(--ink-2)}
.logo-prev{height:46px;display:flex;align-items:center}
.cards3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:8px}
.mcard h3{display:flex;gap:8px;align-items:center}
.mcard .kv{font-size:13px}
.mcard .row{margin-top:auto;padding-top:8px}
.lib{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.blk-row{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface);margin-bottom:8px}
.blk-row.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.blk-row b{flex:1}
.handle{color:var(--ink-3);cursor:grab}
.dragging{opacity:.4}

@media (max-width:1100px){
  .split,.split.wide{grid-template-columns:1fr}
  .builder{grid-template-columns:220px minmax(0,1fr)}
  .builder .b-right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:none}
  .home .c8,.home .c4,.home .c6{grid-column:span 12}
}
@media (max-width:820px){
  .body{grid-template-columns:1fr}
  .rail{display:none}
  .rail.open{display:block;position:fixed;top:92px;left:0;bottom:0;width:260px;z-index:35}
  .top .brand{min-width:0}.top .tenant{display:none}
  .search{display:none}
  .content{padding:16px 14px 90px}.phead{padding:14px 14px 0}
  .savebar{margin:20px -14px -90px;padding:12px 14px}
  .builder{grid-template-columns:1fr}
  .b-left,.b-right,.b-mid{max-height:none}
  .wz{grid-template-columns:1fr}.wzs{position:static;display:flex;overflow-x:auto}
  .grid2,.grid3{grid-template-columns:1fr}
  .qlinks{grid-template-columns:1fr}
  #guide{left:10px;right:10px;width:auto}
}
.menu-btn{display:none}
@media (max-width:820px){.menu-btn{display:grid}}

.handle svg,.tn .drag svg{width:16px;height:16px;stroke-width:3.2}
.handle{display:inline-grid;place-items:center}
@media (max-width:820px){.user>span:not(.av){display:none}.panel>.ph{flex-wrap:wrap}main{overflow-x:hidden}.split>*,.content>*{min-width:0}.tn .lvl{display:none}}

</style>

/* ---------- Navigation ---------- */
const NAV=[
 {grp:'Build',areas:[

  {k:'mobile',label:'Mobile apps',icon:'mobile',rel:'P1',pages:[['overview','Overview','P1'],['marketplace','Marketplace app','P1'],['operations','Operations app','P1'],['both','Both apps','P1']]}]},
 {grp:'Present',areas:[
  {k:'content',label:'Content and SEO',icon:'content',pages:[['pages','Pages'],['navigation','Navigation'],['media','Media'],['collections','Collections'],['forms','Forms'],['seo','SEO'],['redirects','Redirects'],['help','Help centre']]},
  {k:'branding',label:'Branding',icon:'brand',pages:[['identity','Identity'],['colours','Colours'],['typography','Typography'],['shape','Shape','P1'],['icons','Icons'],['documents','Documents'],['domains','Domains'],['subbranding','Partner sub-branding'],['apptheme','App theming','P1'],['builds','Branded builds','P2']]},
  {k:'localization',label:'Localization',icon:'loc',pages:[['languages','Languages'],['translations','Translations'],['currencies','Currencies'],['formats','Regional formats']]}]},
 {grp:'Control',areas:[
  {k:'integrations',label:'Integrations and data',icon:'integ',pages:[['imports','Imports'],['exports','Exports'],['inspeq','Inspeq mapping'],['api','API keys','P1'],['webhooks','Webhooks','P1'],['connectors','Connectors','P1'],['retention','Data retention']]},
  {k:'governance',label:'Governance',icon:'gov',pages:[['changelog','Change log'],['review','Review and publish','P1'],['usage','Usage and limits'],['library','Starter library'],['sandbox','Sandbox','P1'],['approval','Approval policy','P1'],['packages','Packages','P1'],['health','Health checks','P1']]}]},
 {grp:'Setup',areas:[{k:'setup',label:'Guided setup',icon:'setup',pages:[['steps','Guided setup']]}]}

const AREA={};NAV.forEach(g=>g.areas.forEach(a=>AREA[a.k]=a));

/* Studio roles and access (section 2) — E edit, V view, O own (partner), T translations, P params, D drafts, L changelog view */
const ROLES={owner:'Tenant owner',admin:'Studio admin',catalog:'Catalog manager',mpmgr:'Marketplace manager',editor:'Content editor',publisher:'Content publisher',translator:'Translator',partner:'Partner admin',auditor:'Auditor'};
const ACCESS={
 catalog:{owner:'E',admin:'E',catalog:'E',mpmgr:'V',partner:'O',auditor:'V'},
 marketplaces:{owner:'E',admin:'E',catalog:'V',mpmgr:'E',auditor:'V'},

 communication:{owner:'E',admin:'E',mpmgr:'E',editor:'E',publisher:'E',auditor:'V'},

function lvl(area){
 const l=(ACCESS[area]||{})[me().role];

 const tb=$('#toasts');tb.appendChild(t);while(tb.children.length>3)tb.firstChild.remove();setTimeout(()=>t.remove(),4200);

function change(e){
 // e: {area,obj,field,before,after,sensitive,revert,impact}
 if(P1()&&!e.direct){const cs=openCs();cs.items.push(e);renderTop();return 'cs'}
 logIt(e);return 'live';

/* ---------- Generic settings form ---------- */
/* schema: [{h,help,rel,fields:[{k,label,type,options,help,rel,def,suffix,impact,sensitive,tr,ph,wide}]}] */
function form(id,obj,schema,meta){
 FORMS[id]={obj,schema,meta,draft:clone(obj)};
 const ro=meta&&meta.ro;
 const out=schema.map(sec=>{
  const secOff=!relOk(sec.rel);
  const fields=sec.fields.map(f=>{
   const off=secOff||!relOk(f.rel)||ro;
   const v=rel(obj,f.k);const name=`${id}|${f.k}`;
   let input='';
   if(f.type==='select')input=`<select class="in" data-fb="${name}" ${off?'disabled':''} id="${name}">${f.options.map(o=>`<option ${String(o)===String(v)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
   else if(f.type==='toggle')input=`<label class="sw"><input type="checkbox" data-fb="${name}" ${v?'checked':''} ${off?'disabled':''} id="${name}"><span class="k"></span><span>${v?'On':'Off'}</span></label>`;
   else if(f.type==='checks')input=`<div class="checks">${f.options.map(o=>{const oo=Array.isArray(o)?o:[o];const r=oo[1];return `<label><input type="checkbox" data-fb="${name}" value="${esc(oo[0])}" ${(v||[]).includes(oo[0])?'checked':''} ${off||!relOk(r)?'disabled':''}> ${esc(oo[0])} ${relB(r)}</label>`}).join('')}</div>`;
   else if(f.type==='textarea')input=`<textarea class="in" data-fb="${name}" ${off?'disabled':''} id="${name}">${esc(v)}</textarea>`;
   else if(f.type==='static')input=`<div>${f.html}</div>`;
   else input=`<div class="row" style="flex-wrap:nowrap"><input class="in" ${f.type==='number'?'type="number"':''} data-fb="${name}" value="${esc(v)}" ${off?'disabled':''} id="${name}" placeholder="${esc(f.ph||'')}" style="${f.suffix?'max-width:160px':''}">${f.suffix?`<span class="muted">${f.suffix}</span>`:''}</div>`;
   const tr=f.tr?langTabs(obj,f.tr):'';
   return `<div class="fld" ${f.wide?'style="grid-column:1/-1"':''}><label for="${name}">${esc(f.label)} ${relB(f.rel)} ${f.lock?`<span class="lock">${ic('lock')} ${esc(f.lock)}</span>`:''}${f.def!==undefined&&!off?`<button class="reset mut" data-act="resetField" data-arg="${name}" title="Reset to default: ${esc(f.def)}">Reset</button>`:''}${tr}</label>${input}${f.help?`<span class="help">${f.help}</span>`:''}</div>`;
  }).join('');
  return `<section class="fsec"><h3>${esc(sec.h)} ${relB(sec.rel)}</h3>${sec.help?`<p class="sh">${sec.help}</p>`:''}<div class="box ${sec.cols===2?'grid2':''}">${fields}</div></section>`;
 }).join('');
 return out+`<div class="savebar" id="sb_${id}" hidden><span class="grow" id="sbc_${id}"></span><button class="btn" data-act="discardForm" data-arg="${id}">Discard</button><button class="btn pri" data-act="saveForm" data-arg="${id}">${P1()?'Add to change set':'Save changes'}</button></div>`;
}
function formDiff(id){const F=FORMS[id];const d=[];F.schema.forEach(s=>s.fields.forEach(f=>{if(!f.k)return;const a=rel(F.obj,f.k),b=rel(F.draft,f.k);if(JSON.stringify(a)!==JSON.stringify(b))d.push({f,before:a,after:b})}));return d}
function setPath(o,path,v){const ks=path.split('.');let t=o;ks.slice(0,-1).forEach(k=>t=t[k]);t[ks[ks.length-1]]=v}
function onFormInput(el){
 const [id,k]=el.dataset.fb.split('|');const F=FORMS[id];if(!F)return;
 let v;if(el.type==='checkbox'&&el.value&&el.value!=='on'){v=$$(`[data-fb="${id}|${k}"]`).filter(x=>x.checked).map(x=>x.value)}
 else if(el.type==='checkbox'){v=el.checked;const s=el.parentElement.querySelector('span:last-child');if(s)s.textContent=v?'On':'Off'}
 else v=el.value;
 setPath(F.draft,k,v);
 const n=formDiff(id).length;const bar=$('#sb_'+id);if(bar){bar.hidden=!n;$('#sbc_'+id).textContent=`${n} unsaved change${n===1?'':'s'}`}
 F.meta&&F.meta.onInput&&F.meta.onInput(F.draft,k);
}
A.discardForm=id=>{render()};
A.resetField=name=>{const [id,k]=name.split('|');const F=FORMS[id];let f;F.schema.forEach(s=>s.fields.forEach(x=>{if(x.k===k)f=x}));const el=$(`[data-fb="${name}"]`);if(!el)return;
 if(el.type==='checkbox'&&el.value&&el.value!=='on'){$$(`[data-fb="${name}"]`).forEach(c=>c.checked=(f.def||[]).includes(c.value));onFormInput(el)}else if(el.type==='checkbox'){el.checked=!!f.def;onFormInput(el)}else{el.value=f.def;onFormInput(el)}};
A.saveForm=id=>{
 const F=FORMS[id];const diffs=formDiff(id);if(!diffs.length)return;
 const imps=diffs.map(d=>d.f.impact&&d.f.impact(d.before,d.after,F.draft)).filter(Boolean);
 const commit=()=>{
  let res;diffs.forEach(d=>{const before=clone(d.before);setPath(F.obj,d.f.k,clone(d.after));const fo=F.obj;const k=d.f.k;
   res=change({area:F.meta.area,obj:F.meta.obj,field:d.f.label,before:fmtV(d.before),after:fmtV(d.after),sensitive:d.f.sensitive,revert:()=>setPath(fo,k,before)})});
  F.meta.onSave&&F.meta.onSave(F.obj,diffs);
  savedToast(res);render();
 };
 if(imps.length)impactDlg(imps,commit);else commit();
};
const fmtV=v=>Array.isArray(v)?v.join(', '):typeof v==='boolean'?(v?'On':'Off'):String(v??'—');

function langTabs(obj,base){return `<span class="lt">${S.tenant.langs.map(c=>{const v=rel(obj,base+'.'+c);return `<button type="button" data-act="setLang" data-arg="${c}" aria-pressed="${S.ui.lang===c}" class="${v?'':'miss'}" title="${v?'':(c.toUpperCase()+' missing, falls back to English')}">${c.toUpperCase()}</button>`}).join('')}</span>`}
A.setLang=c=>{S.ui.lang=c;rerender()};

function emit(key){

 const idx=g.steps.findIndex(s=>s[2]===key);
 if(idx>=0&&!st.includes(key)){st.push(key);renderGuide();if(st.length===g.steps.length)setTimeout(()=>toast(`Flow complete: ${g.name}`),400)}
}
function renderGuide(){
 const el=$('#guide');el.hidden=!S.ui.guideOpen;if(!S.ui.guideOpen)return;

 else{const st=S.flowState[g.id]||[];const cur=g.steps.findIndex(s=>!st.includes(s[2]));
  body=`<ol>${g.steps.map((s,i)=>`<li class="${st.includes(s[2])?'done':i===cur?'cur':''}"><span>${s[0]}${i===cur?`<a href="${s[1]}">Go there</a>`:''}</span></li>`).join('')}</ol><div style="padding:6px 14px 10px;display:flex;gap:8px"><button class="btn sm" data-act="guideList">All flows</button><button class="btn sm" data-act="startGuide" data-arg="${g.id}">Restart</button></div>`}
 el.innerHTML=`<div class="gh"><h3>${g?g.name:'Click-through flows'}</h3><button class="iconbtn" data-act="closeGuide" aria-label="Close flows">${ic('x')}</button></div><div class="gb">${body}</div>`;
}

 PARAMS=h.split('/');let [area,page]=PARAMS;

 renderTop();renderRail();

 else if(!AREA[area]||!lvl(area)){view={title:'You don’t have access to this area',body:`<div class="panel"><div class="empty"><h3>This area isn’t part of your Studio role</h3><p>${esc(ROLES[me().role])} can’t open ${esc(AREA[area]?AREA[area].label:'this page')}. Ask a Tenant owner to change your role or delegate the area.</p><a class="btn" href="#/home">Go to Studio home</a></div></div>`}}
 else{

 }

 <div class="content">${ro?`<div class="ro-banner">${ic('eye')} <span>View only. ${esc(ROLES[me().role])} can see this area but not change it.</span></div>`:''}${view.body}</div>`;
 if(ro)$$('input,select,textarea',main).forEach(x=>{if(!x.closest('.keep'))x.disabled=true});

function logoSvg(dark,size){
 if(!S.brand.logo)return `<span class="muted">No logo</span>`;
 if(S.brand.logo!=='nw')return `<img src="${S.brand.logo}" alt="Logo" style="max-height:${size||40}px;max-width:200px">`;
 const c=dark?'#fff':S.brand.primary;
 return `<svg height="${size||34}" viewBox="0 0 190 40" role="img" aria-label="Northwind Equipment logo"><path d="M4 34L18 6l8 16 6-10 10 22z" fill="${c}"/><text x="50" y="22" font-family="Archivo,sans-serif" font-weight="800" font-size="17" font-stretch="75%" fill="${dark?'#fff':'#17252B'}">NORTHWIND</text><text x="50" y="35" font-family="Archivo,sans-serif" font-size="9.5" letter-spacing="2.2" fill="${dark?'#dfe':'#5B6B70'}">EQUIPMENT</text></svg>`;
}
function hexRgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16)/255)}
function lum(h){return hexRgb(h).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)).reduce((a,c,i)=>a+c*[.2126,.7152,.0722][i],0)}
function ratio(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function contrastLine(c){const r=ratio(c,'#FFFFFF');const ok=r>=4.5;return `<span class="contrast" style="margin-top:6px">${ic(ok?'check':'warn')} White text on this colour: ${r.toFixed(2)}:1, ${ok?'passes WCAG 2.1 AA':'fails AA for body text. Try a darker shade.'}</span>`}
function lcardHtml(l,o={}){
 const showW=o.wholesale;
 return `<div class="lcard"><div class="img">${ic('excav')}</div><div class="b"><b>${l.make} ${l.model}</b><small>${l.year}, ${nf(l.hours)} h, ${l.country}</small>
 <div class="pr">${o.hidePrice?'Sign in to see price':eur(l.price)}</div>${showW?`<div class="ws">Wholesale ${eur(l.wholesale)}</div>`:''}
 <div class="badges">${l.cert?'<span class="bdg c">Certified</span>':''}${l.insp?'<span class="bdg">Inspected</span>':''}</div></div></div>`;
}
function miniSite(o={}){

 return `<div class="mini-site" style="--brand:${S.brand.primary}"><div class="nav"><span class="lg">${S.brand.logo?logoSvg(false,26):'<b>Northwind Used</b>'}</span><span>Machines</span><span>Financing</span><span>Locations</span><span style="margin-left:auto">${o.who||'Sign in'}</span></div>

 ${ls.length?`<div class="lgrid">${ls.map(l=>lcardHtml(l,o)).join('')}</div>`:`<p style="padding:14px;color:#76858B">No listings yet.</p>`}</div>`;
}

 const sel=TN(S.ui.sel.tax)||S.taxonomy.find(n=>n.id==='crawler-exc')||S.taxonomy[0];S.ui.sel.tax=sel.id;
 const q=(S.ui.taxq||'').toLowerCase();
 const match=n=>!q||n.name.en.toLowerCase().includes(q)||kids(n.id).some(match);
 const node=n=>{const ch=kids(n.id);const open=S.ui.open[n.id]!==false;
  return `<li><div class="tn ${n.id===sel.id?'sel':''} ${n.active?'':'inactive'}" draggable="true" data-id="${n.id}" data-act="selNode" data-arg="${n.id}" tabindex="0">

  actions:`<button class="btn mut" data-act="libDlg">Import from Krank library</button><button class="btn" data-act="noop" data-arg="Taxonomy exported to Excel">Export</button><button class="btn" disabled title="Phase 1">Import from Excel ${relB('P1')}</button><button class="btn pri mut" data-act="addNode" data-arg="">${ic('plus')}Add division</button>`,

  <div class="sticky">${nodePanel(sel)}</div></div>`,
  after:bindTreeDnD};
};

function bindTreeDnD(){
 let drag=null;
 $$('.tn[draggable]').forEach(el=>{
  el.addEventListener('dragstart',e=>{drag=el.dataset.id;e.dataTransfer.effectAllowed='move';el.classList.add('dragging')});
  el.addEventListener('dragend',()=>{el.classList.remove('dragging');$$('.tn.drop').forEach(x=>x.classList.remove('drop'))});
  el.addEventListener('dragover',e=>{if(!drag||drag===el.dataset.id)return;e.preventDefault();el.classList.add('drop')});
  el.addEventListener('dragleave',()=>el.classList.remove('drop'));
  el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drop');const d=TN(drag),t=TN(el.dataset.id);if(!d||!t||!canEdit('catalog'))return;
   const li=LEVELS.indexOf(d.level),lt=LEVELS.indexOf(t.level);
   const doMove=(np,before)=>{const op=d.parent;S.taxonomy.splice(S.taxonomy.indexOf(d),1);const at=before?S.taxonomy.indexOf(before):S.taxonomy.indexOf(kids(np).slice(-1)[0]||TN(np))+1;S.taxonomy.splice(at,0,d);d.parent=np;
    savedToast(change({area:'Catalog',obj:'Taxonomy: '+d.name.en,field:op===np?'Sort order':'Parent',before:op===np?'—':(TN(op)||{name:{en:'—'}}).name.en,after:op===np?'Before '+t.name.en:TN(np).name.en}),op===np?'New order':'Move');rerender()};
   if(lt===li)doMove(t.parent,t);
   else if(lt===li-1){if(d.listings)impactDlg([{num:nf(d.listings),title:`${d.listings} listings move with ${d.name.en}`,text:`Their URLs redirect automatically to the new path under ${t.name.en}.`}],()=>doMove(t.id,null),'Move');else doMove(t.id,null)}
   else toast(`A ${d.level.toLowerCase()} can’t go there. Drop it on a sibling or on a ${LEVELS[li-1]?.toLowerCase()||'top level'}.`,'err')});
 });
}

/* ================= Template builder ================= */
const tplOf=id=>S.templates.find(t=>t.id===id);
function fieldsAll(t){return t.sections.flatMap(s=>s.fields.map(f=>({s,f})))}
function findF(t,id){for(const s of t.sections){const f=s.fields.find(x=>x.id===id);if(f)return {s,f}}return {}}
const effV=(s,f,flow)=>(f.vis&&f.vis[flow])||s.vis[flow];
const isReqOEM=(s,f)=>effV(s,f,'create')==='R'&&!f.partner;
function partnerCtx(t){const u=me();if(u.role!=='partner')return null;return {org:u.org,mode:t.mode}}
function snap(t){t._undo=t._undo||[];t._undo.push(JSON.stringify(t.sections));if(t._undo.length>40)t._undo.shift();t._redo=[];t.dirty=true}
function templateBuilder(id,tab){
 const t=tplOf(id);if(!t)return {title:'Template not found',body:''};
 const pc=partnerCtx(t);const locked=pc&&t.mode==='Locked';
 const tabs=[['build','Build'],['visibility','Visibility by flow'],...(pc?[]:[['variants','Partner variants']]),['history','History']];

 const editing=S.ui.editingBy&&S.ui.editingBy[id];
 const head={title:esc(t.name),sub:`${SUBS[t.sub]||(TN(t.sub)||{name:{en:t.sub}}).name.en}, ${t.ltype.toLowerCase()}, ${t.purpose.toLowerCase()}. ${modeChip(t.mode)} <span class="chip ${t.status==='Published'?'ok':'warn'}">${t.status} v${t.version}</span>${t.dirty?' <span class="tag">Unpublished draft changes</span>':''}`,crumbs,
  tabsHtml:`<nav class="tabs">${tabs.map(([k,l])=>`<a href="#/catalog/templates/${id}/${k}" class="${tab===k?'on':''}">${l}</a>`).join('')}</nav>`,
  actions:locked?`<span class="lock">${ic('lock')} Locked by Northwind Equipment</span>`:pc?`<button class="btn pri" data-act="pSave" data-arg="${id}">Save your variant</button>`:`<button class="btn mut" data-act="undo" data-arg="${id}" ${(t._undo||[]).length?'':'disabled'} aria-label="Undo">${ic('undo')}</button><button class="btn mut" data-act="redo" data-arg="${id}" ${(t._redo||[]).length?'':'disabled'} aria-label="Redo">${ic('redo')}</button><span class="muted" style="font-size:12px">Draft autosaved</span><button class="btn pri mut" data-act="pubTpl" data-arg="${id}">Publish</button>`};
 if(!canEdit('catalog')&&!pc)head.ro=true;
 if(tab==='visibility')return Object.assign(head,{body:visMatrix(t,pc)});
 if(tab==='variants')return Object.assign(head,{body:variantsTab(t)});
 if(tab==='history')return Object.assign(head,{body:`<div class="tw"><table class="t"><thead><tr><th>Version</th><th>Published by</th><th>When</th><th>Note</th><th></th></tr></thead><tbody>${(t.history.length?t.history:[{v:t.version,by:t.by,at:t.at,note:'Draft'}]).map((h,i)=>`<tr><td>v${h.v}${i===0?' <span class="chip ok">Current</span>':''}</td><td>${h.by}</td><td>${h.at}</td><td>${h.note}</td><td>${i?`<button class="btn sm mut" data-act="noop" data-arg="v${h.v} restored as a draft">Restore as draft</button>`:''}</td></tr>`).join('')}</tbody></table></div><p class="muted" style="margin-top:10px">Existing listings stay on the version they were created with until they are edited.</p>`});
 // Build tab
 const selId=S.ui.sel.fld&&findF(t,S.ui.sel.fld).f?S.ui.sel.fld:null;
 const selSec=!selId&&S.ui.sel.sec&&t.sections.find(s=>s.id===S.ui.sel.sec)?S.ui.sel.sec:null;
 const flow=S.ui.flow;

  ${s.fields.filter(f=>!f.retired).map(f=>{const h=effV(s,f,flow)==='H'||(pc&&f.hiddenFor&&f.hiddenFor.includes(pc.org));return `<div class="ofld ${selId===f.id?'sel':''} ${h?'hid':''}" data-act="selFld" data-arg="${f.id}" draggable="${!pc&&!locked}" data-fid="${f.id}">${esc(f.label.en)}${f.inherited?'<span class="tag inh">inherited</span>':''}${f.partner?`<span class="tag prt">${orgName(f.partner)}</span>`:''}${f.operatorOnly?'<span class="tag op">operator</span>':''}</div>`}).join('')}`).join('');

 return Object.assign(head,{body:`${pc&&!locked?`<div class="note info">${ic('info')}<span>${t.mode==='Extendable'?'Extendable template. You can add sections and fields for Hughes Plant listings and hide optional Northwind fields in your own flows. Required Northwind fields stay.':'Partner-owned. You build and maintain this template for Hughes Plant.'}</span></div>`:''}
 ${editing?`<div class="note warn">${ic('warn')}<span>${editing} is editing this template. It opens read-only until they leave. <button class="btn sm" data-act="takeOver" data-arg="${id}">Take over</button></span></div>`:''}

  <div class="b-mid"><div class="b-hd"><label class="row" style="gap:6px;font-weight:500">Flow <select class="in" style="width:auto;padding:4px 6px" data-ch="setFlow">${flows}</select></label><span style="flex:1"></span><div class="segc" role="group" aria-label="Device">${['desktop','mobile'].map(d=>`<button data-act="setDevice" data-arg="${d}" aria-pressed="${S.ui.device===d}">${d==='desktop'?'Desktop':'Mobile'}</button>`).join('')}</div><span class="lt">${S.tenant.langs.map(c=>`<button data-act="setLang" data-arg="${c}" aria-pressed="${S.ui.lang===c}">${c.toUpperCase()}</button>`).join('')}</span></div>
   <div class="canvas ${S.ui.device}" id="canvas">${canvasHtml(t,flow,selId,selSec,pc)}</div></div>
  <div class="b-right"><div class="b-hd">Properties</div>${selId?fieldProps(t,selId,pc,locked):selSec?secProps(t,selSec,pc,locked):'<div class="props muted">Select a section or field in the outline or on the canvas.</div>'}</div>
 </div>`,after:()=>bindBuilderDnD(t)});
}
function sampleVal(f){const L=S.listings[3]||{make:'Northwind',model:'NX 250',year:2019,hours:7840,price:96500,wholesale:83000,country:'DE'};
 return {make:L.make,model:L.model,year:L.year,hours:nf(L.hours)+' h',serial:'NW250-19-04417',location:'Leeds, GB',price:eur(L.price),vat:'Excluded',por:'No',wholesale:eur(L.wholesale),weight:'24.8 t',power:'129 kW',bucket:'1.2 m³',uc:'Good',tracks:'Steel',coupler:'Yes',ac:'Yes',hammer:'No',cost:eur(Math.round(L.price*.7)),verified:'Yes',sellerPhone:'+44 7700 900123',capacity:'100 t',boom:'60 m',axles:'4',lift:'9.4 m',cap:'4.1 t'}[f.key]||(f.options&&f.options[0])||'—'}
function canvasHtml(t,flow,selId,selSec,pc){
 const L=S.ui.lang;const isForm=['create','cust','insp','val'].includes(flow);

function fieldProps(t,fid,pc,locked){
 const {s,f}=findF(t,fid);const L=S.ui.lang;
 const oemLocked=pc&&!f.partner;const dis=locked||oemLocked?'disabled':'';

 return `<div class="props">

function previewAs(m){
 const pv=S.ui.pv||{kind:'anon'};
 const orgOpts=ORGS.filter(o=>o.id!=='nw');
 const isPartner=pv.kind==='partner'||(pv.kind==='org'&&['msc','hughes','bauer','nordic'].includes(pv.org));
 const wholesale=m.scope.wholesaleVis==='Partner users only'?isPartner:m.scope.wholesaleVis==='Chosen roles'?pv.kind==='partner':false;
 const signed=pv.kind!=='anon';
 const blocked=m.access.browsing==='Sign-in required'&&!signed;
 const notMember=pv.kind==='org'&&pv.org==='kessler'&&m.type!=='Public';
 const ls=visibleListings(m,pv);
 const who=pv.kind==='anon'?'Sign in':pv.kind==='buyer'?'Signed in: Mark Richter':pv.kind==='partner'?'Signed in: Raj Patel':`Viewing as ${orgName(pv.org)}`;
 let inner;
 if(blocked)inner=`<div class="mini-site" style="--brand:${S.brand.primary}"><div class="nav"><span class="lg">${logoSvg(false,26)}</span><span style="margin-left:auto">Sign in</span></div><div style="padding:40px 20px;text-align:center"><h2 style="margin-bottom:8px">Sign in to browse ${esc(m.name)}</h2><p style="color:#46565D">${m.access.registration==='Approval required'?'New accounts are reviewed before access is granted.':''}</p></div></div>`;
 else if(notMember)inner=`<div class="mini-site"><div style="padding:40px 20px;text-align:center"><h2>Kessler Tiefbau isn’t a member of ${esc(m.name)}</h2><p style="color:#46565D">They would see a request-access page.</p></div></div>`;
 else inner=miniSite({listings:ls,count:12,wholesale,hidePrice:m.prices.hideAnon&&!signed,who,heroTitle:m.name,heroSub:`${m.type} marketplace${wholesale?', wholesale prices shown':''}`});
 return {body:`<div class="toolbar"><span>Preview as</span><div class="segc">${[['anon','Anonymous visitor'],['buyer','Signed-in buyer'],['partner','Partner user']].map(([k,l])=>`<button data-act="pvKind" data-arg="${k}" aria-pressed="${pv.kind===k}">${l}</button>`).join('')}</div>
  <select class="in" style="width:auto" data-ch="pvOrg" aria-label="Preview as organization"><option value="">A chosen organization…</option>${orgOpts.map(o=>`<option value="${o.id}" ${pv.org===o.id&&pv.kind==='org'?'selected':''}>${o.name} (${o.type})</option>`).join('')}</select></div>
  <div class="note info">${ic('eye')}<span>Showing exactly what ${pv.kind==='org'?orgName(pv.org):pv.kind==='anon'?'an anonymous visitor':pv.kind==='buyer'?'a signed-in buyer':'a partner user'} sees: ${blocked||notMember?'no listings':`${ls.length} sample listings${ls.length>12?' (first 12 shown)':''}`}, wholesale prices ${wholesale?'<b>shown</b>':'hidden'}.</span></div>${inner}`};
}

function roleEditor(id){
 const r=S.roles.find(x=>x.id===id);if(!r)return {title:'Role not found',body:''};
 const editable=!r.def&&P1()&&canEdit('network');
 const rows=ATOMS.map(([g,as])=>`<tr class="sec"><th class="rowh">${g} ${g==='Auctions'?relB('P2'):g==='Operations'?relB('P1'):''}</th>${SCOPES.map(()=>'<td></td>').join('')}</tr>`+as.map(a=>`<tr><th class="rowh" style="padding-left:22px;font-weight:500">${a}</th>${SCOPES.map(sc=>{const on=r.grants[a].includes(sc[0]);return `<td class="c"><input type="checkbox" ${on?'checked':''} ${editable?'':'disabled'} data-ch="grant" data-arg="${id}|${a}|${sc[0]}" aria-label="${a}, ${sc}"></td>`}).join('')}</tr>`).join('')).join('');
 return {title:esc(r.name),crumbs:`<a href="#/home">Studio</a> / <a href="#/network/roles">Network and access</a> / <a href="#/network/roles">Roles</a>`,tabKey:'roles',
  sub:r.def?'Default role. Clone it to make changes.':`Custom role${r.from?`, cloned from ${esc(r.from)}`:''}. A role can’t grant more than the editor holds.`,
  actions:r.def?`<button class="btn" data-act="cloneRole" data-arg="${id}" ${P1()?'':'disabled'}>Clone</button>`:`<span class="muted" style="font-size:12.5px">Changes need a second approver</span>`,
  body:`<div class="split" style="grid-template-columns:minmax(0,1fr) 300px"><div class="tw"><table class="mx"><thead><tr><th class="rowh">Permission</th>${SCOPES.map(s=>`<th style="text-align:center">${s}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
  <div class="panel"><div class="ph"><h3>Studio area access</h3></div><div class="pb">${['Catalog','Marketplaces','Network','Content','Governance'].map(a=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span>${a}</span><select class="in" style="width:110px" ${editable?'':'disabled'}><option>Hidden</option><option>View</option><option>Edit</option></select></div>`).join('')}</div></div></div>`};
}
A.grant=(arg,el)=>{const [id,a,sc]=arg.split('|');const r=S.roles.find(x=>x.id===id);const b=r.grants[a].join('');
 if(!el.checked){r.grants[a]=r.grants[a].filter(x=>x!==sc)}else r.grants[a].push(sc);
 if(!el.checked&&r.users)toast(`${r.users} users lose “${a}” at ${SCOPES.find(x=>x[0]===sc)} scope`);
 change({area:'Network',obj:'Role: '+r.name,field:`${a} (${SCOPES.find(x=>x[0]===sc)})`,before:b.includes(sc)?'Allowed':'Not allowed',after:el.checked?'Allowed':'Not allowed',sensitive:true,revert:()=>{r.grants[a]=[...b]}});

  :b.t==='form'?`<div class="fld"><label>Form</label><select class="in">${S.forms.map(f=>`<option>${f[0]}</option>`).join('')}</select><span class="help">Destination: create an enquiry.</span></div><div class="fld"><label>Title</label><input class="in" value="${esc(b.title||'')}" data-ch="bset" data-arg="${id}|${sel}|title"></div>`
  :`<p class="muted">This block has no settings in the prototype.</p>`;
 const picker=BLOCKS.map(([g,bs])=>`<h4 style="margin:10px 0 6px">${g}</h4><div class="row" style="gap:6px">${bs.map(([k,l,r])=>`<button class="btn sm" data-act="addBlk" data-arg="${id}|${k}" ${relOk(r)?'':'disabled'}>${l} ${relB(r)}</button>`).join('')}</div>`).join('');

A.blkPicker=()=>{S.ui.picker=!S.ui.picker;rerender()};
A.selBlk=(i,el,e)=>{if(e.target.closest('button'))return;S.ui.sel.blk=+i;rerender()};
A.addBlk=arg=>{const [id,t]=arg.split('|');const pg=pageOf(id);const b={t};if(t==='hero')Object.assign(b,{h:'Certified excavators under €80,000',s:'Inspected by Northwind, ready to work.',cta:'See the machines'});if(t==='rich')b.text='Every machine on this page passed a Northwind inspection in the last 90 days.';if(t==='grid')Object.assign(b,{cert:false,subs:[],max:'',count:'8'});if(t==='form')b.title='Ask about these machines';
 pg.blocks.push(b);S.ui.sel.blk=pg.blocks.length-1;S.ui.picker=false;pg.edited='15 Oct 2026';chkBlocks(pg);rerender()};
function chkBlocks(pg){const ts=pg.blocks.map(b=>b.t);if(['hero','rich','grid','form'].every(x=>ts.includes(x)))emit('pg-blocks');const g=pg.blocks.find(b=>b.t==='grid');if(g&&g.cert&&(g.subs||[]).includes('exc')&&g.max&&+g.max<=80000)emit('pg-filter')}
A.bset=(arg,el)=>{const [id,i,k]=arg.split('|');const pg=pageOf(id);pg.blocks[+i][k]=el.type==='checkbox'?el.checked:el.value;chkBlocks(pg);rerender()};
A.bsub=(arg,el)=>{const [id,i,k]=arg.split('|');const b=pageOf(id).blocks[+i];b.subs=b.subs||[];if(el.checked)b.subs.push(k);else b.subs=b.subs.filter(x=>x!==k);chkBlocks(pageOf(id));rerender()};
A.mvBlk=arg=>{const [id,i,d]=arg.split('|');const bs=pageOf(id).blocks;const j=+i+ +d;if(j<0||j>=bs.length)return;const [x]=bs.splice(+i,1);bs.splice(j,0,x);S.ui.sel.blk=j;rerender()};
A.rmBlk=arg=>{const [id,i]=arg.split('|');pageOf(id).blocks.splice(+i,1);S.ui.sel.blk=null;rerender()};
A.pDev=d=>{S.ui.pdev=d;if(d==='mobile')emit('pg-mobile');rerender()};
A.pageSettings=id=>{const pg=pageOf(id);dlg('Page settings',`<div class="grid2"><div class="fld"><label>Title</label><input class="in" value="${esc(pg.title)}"></div><div class="fld"><label>Slug</label><input class="in" value="${esc(pg.slug)}"></div><div class="fld"><label>Visibility</label><select class="in"><option>Public</option><option>Signed in</option><option>Private-marketplace members</option><option>Chosen organizations or roles</option></select></div><div class="fld"><label>Canonical URL</label><input class="in"></div><div class="fld"><label>SEO title</label><input class="in" value="${esc(pg.title)} | Northwind Used"></div><div class="fld"><label>Noindex</label><label class="sw"><input type="checkbox"><span class="k"></span><span>Off</span></label></div><div class="fld"><label>Publish date ${relB('P1')}</label><input class="in" type="date" ${P1()?'':'disabled'}></div><div class="fld"><label>Unpublish date ${relB('P1')}</label><input class="in" type="date" ${P1()?'':'disabled'}></div></div>`,`<button class="btn" data-act="closeDlg">Cancel</button><button class="btn pri" data-act="closeDlg">Save settings</button>`)};
A.pubPage=id=>{const pg=pageOf(id);const b=pg.status;pg.status='Published';pg.edited='15 Oct 2026';logIt({area:'Content',obj:'Page: '+pg.title,field:'Status',before:b,after:'Published'});emit('pg-pub');toast(`Published: ${pg.title}`,'',['Add to header menu','#/content/navigation']);rerender()};

function msgEditor(key){
 const ev=S.events.find(e=>e[1]===key);
 const tpl=S.msgTpl[key]||(S.msgTpl[key]={email:{en:{subject:key,pre:'',body:'Hi {recipient.first_name},\n\n'},de:{subject:'',pre:'',body:''}},inapp:{en:{title:key,text:'',link:''},de:{title:'',text:'',link:''}},push:{en:{title:'',text:''},de:{}},sms:{en:{text:''},de:{text:''}}});

 const fill=s=>esc(s||'').replace(/{([a-z_.]+)}/g,(m,k)=>sample[k]||m).replace(/\n/g,'<br>');

  :`<div class="phone" style="height:300px;--brand:${S.brand.primary}"><div class="notch"><span>9:41</span><span>●●●</span></div><div class="scr"><div class="blk"><h5>${fill(d.title||'Northwind')}</h5>${fill(d.text)}</div></div></div>`;
 return {title:esc(key),crumbs:`<a href="#/home">Studio</a> / <a href="#/communication/messages">Communication</a> / <a href="#/communication/messages">Messages</a>`,tabKey:'messages',

V['governance/changelog']=()=>{
 const f=S.ui.clf||{};const users=[...new Set(S.log.map(l=>l.user))];const areas=[...new Set(S.log.map(l=>l.area))];
 const rows=S.log.filter(l=>(!f.user||l.user===f.user)&&(!f.area||l.area===f.area)&&(!f.q||(l.obj+l.field+l.after).toLowerCase().includes(f.q.toLowerCase())));
 const pubCs=new Set(S.changeSets.filter(c=>c.state==='Published').map(c=>c.name));
 return {title:'Change log',sub:'Every Studio save, including denied attempts, with user, impersonator, organization, and before and after values. Kept for at least seven years.',
  actions:`<button class="btn" data-act="noop" data-arg="Change log exported to CSV with current filters">Export CSV</button>`,
  body:`<div class="toolbar keep"><input class="in keep" style="max-width:240px" placeholder="Search object, field or value" value="${esc(f.q||'')}" data-ch="clf" data-arg="q" aria-label="Search change log"><select class="in keep" style="width:auto" data-ch="clf" data-arg="user" aria-label="User"><option value="">User: all</option>${users.map(u=>`<option ${f.user===u?'selected':''}>${esc(u)}</option>`).join('')}</select><select class="in keep" style="width:auto" data-ch="clf" data-arg="area" aria-label="Area"><option value="">Area: all</option>${areas.map(a=>`<option ${f.area===a?'selected':''}>${a}</option>`).join('')}</select></div>
  <div class="tw"><table class="t"><thead><tr><th>When</th><th>User</th><th>Area</th><th>Object</th><th>Field</th><th>Before</th><th>After</th><th>Change set ${relB('P1')}</th></tr></thead><tbody>${rows.map(l=>`<tr><td style="white-space:nowrap"><small>${l.t}</small></td><td>${esc(l.user)}${l.imp?`<br><small>via ${esc(l.imp)}</small>`:''}</td><td>${l.area}</td><td>${esc(l.obj)}</td><td>${esc(l.field)}</td><td><span style="color:var(--err)">${esc(l.before)}</span></td><td><span style="color:var(--ok)">${esc(l.after)}</span></td><td>${l.cs?`<small>${esc(l.cs)}</small>${pubCs.has(l.cs)&&P1()&&canEdit('governance')?`<br><button class="btn sm" data-act="rollback" data-arg="${esc(l.cs)}">Roll back</button>`:''}`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No entries match these filters.</td></tr>'}</tbody></table></div>`};
};
A.clf=(k,el)=>{S.ui.clf=S.ui.clf||{};S.ui.clf[k]=el.value;rerender()};
const CS_CHIP={Open:'',['In review']:'warn',Returned:'err',Approved:'info',Scheduled:'info',Published:'ok','Rolled back':'',Discarded:''};
V['governance/review']=p=>{
 const sets=S.changeSets.filter(c=>c.state!=='Discarded');
 let cs=S.changeSets.find(c=>c.id===p[2])||S.changeSets.find(c=>c.state==='Open'&&c.author===me().name&&c.items.length)||sets.find(c=>c.state==='In review')||sets[sets.length-1];
 const list=sets.length?sets.slice().reverse().map(c=>`<a href="#/governance/review/${c.id}" class="blk-row ${cs&&c.id===cs.id?'sel':''}" style="text-decoration:none;color:inherit;display:flex"><span style="flex:1"><b style="display:block">${esc(c.name)}</b><small>${c.items.length} change${c.items.length===1?'':'s'}, ${esc(c.author)}${c.env==='sandbox'?', sandbox':''}</small></span><span class="chip ${CS_CHIP[c.state]}">${c.state}</span></a>`).join(''):'<p class="muted">No change sets yet. Edits you make in Phase 1 collect in your open change set.</p>';
 if(!cs)return {title:'Review and publish',body:`<div class="panel"><div class="empty"><h3>Nothing to review</h3><p>When you edit settings, changes collect here instead of going live. Review the diff and impact, then publish, schedule or send for approval.</p></div></div>`};
 const needsAppr=cs.items.some(i=>i.sensitive);
 const isAuthor=cs.author===me().name;const canApprove=['owner'].includes(me().role)||(me().role==='admin'&&!isAuthor);
 const diffs=cs.items.map(i=>`<div class="cg"><div class="cgh"><b>${esc(i.obj)}</b><span class="tag">${i.area}</span>${i.sensitive?'<span class="chip warn plain">Needs approval</span>':''}</div><div class="diff"><div class="hd">${esc(i.field)}, before</div><div class="hd">After</div><div class="bf">${esc(i.before)}</div><div class="af">${esc(i.after)}</div></div></div>`).join('');
 const imp=cs.items.some(i=>i.area==='Network')?'Roles: 0 live users affected until published; then new users can be assigned “Junior sales”.':cs.items.some(i=>i.area==='Mobile apps')?'Apps pick up the change on next resume or within 15 minutes.':'Applies to the web marketplace within 60 seconds.';
 let acts='';
 if(cs.state==='Open'&&isAuthor)acts=needsAppr?`<button class="btn" data-act="csDiscard" data-arg="${cs.id}">Discard</button><button class="btn pri" data-act="csSend" data-arg="${cs.id}">Send for approval</button>`:`<button class="btn" data-act="csDiscard" data-arg="${cs.id}">Discard</button><button class="btn" data-act="csSchedule" data-arg="${cs.id}">Schedule</button><button class="btn" data-act="csSend" data-arg="${cs.id}">Send for approval</button><button class="btn pri" data-act="csPublish" data-arg="${cs.id}">${cs.env==='sandbox'?'Promote to live':'Publish now'}</button>`;
 else if(cs.state==='In review')acts=canApprove?`<button class="btn" data-act="csReturn" data-arg="${cs.id}">Return with comment</button><button class="btn pri" data-act="csApprove" data-arg="${cs.id}">Approve</button>`:`<span class="muted">${isAuthor?'Waiting for a Tenant owner to approve. You can’t approve your own change set.':'Only a Tenant owner can approve this.'}</span>`;
 else if(cs.state==='Approved'||cs.state==='Scheduled')acts=`<button class="btn" data-act="csSchedule" data-arg="${cs.id}">Schedule</button><button class="btn pri" data-act="csPublish" data-arg="${cs.id}">${cs.env==='sandbox'?'Promote to live':'Publish now'}</button>`;
 else if(cs.state==='Published')acts=`<button class="btn dng" data-act="rollback" data-arg="${esc(cs.name)}">Roll back</button>`;
 return {title:'Review and publish',sub:'Edits collect in your open change set instead of going live. Publish now, schedule, or send for approval.',
  body:`<div class="split" style="grid-template-columns:320px minmax(0,1fr)"><div>${list}</div><div class="panel"><div class="ph"><h3>${esc(cs.name)}</h3><span class="chip ${CS_CHIP[cs.state]}">${cs.state}</span>${cs.env==='sandbox'?'<span class="chip sb">Sandbox</span>':''}</div><div class="pb">
   <dl class="kv" style="margin-bottom:14px"><dt>Author</dt><dd>${esc(cs.author)}</dd><dt>Created</dt><dd>${cs.created}</dd>${cs.approver?`<dt>Approved by</dt><dd>${esc(cs.approver)}</dd>`:''}${cs.when?`<dt>Scheduled for</dt><dd>${cs.when}</dd>`:''}</dl>
   ${cs.comments.map(c=>`<div class="note warn">${ic('info')}<span><b>${esc(c.by)}:</b> ${esc(c.text)}</span></div>`).join('')}
   <h4 style="margin-bottom:8px">Changes</h4>${diffs||'<p class="muted">Empty.</p>'}
   <h4 style="margin:14px 0 6px">Impact</h4><p>${imp}</p>
   <h4 style="margin:14px 0 6px">Validation</h4><div class="note ok">${ic('check')}<span>No blocking errors. ${needsAppr?'Contains a change type that needs a second approver (roles and permissions).':'No approval needed.'}</span></div>
   <div class="row" style="justify-content:flex-end;margin-top:14px">${acts}</div></div></div></div>`};
};
const csOf=id=>S.changeSets.find(c=>c.id===id);
A.csSend=id=>{const c=csOf(id);c.state='In review';logIt({area:'Governance',obj:'Change set: '+c.name,field:'State',before:'Open',after:'In review'});emit('cs-sent');toast('Sent for approval. Tenant owners see it on Studio home.');rerender()};
A.csApprove=id=>{const c=csOf(id);if(c.author===me().name){toast('You can’t approve your own change set','err');return}c.state='Approved';c.approver=me().name;logIt({area:'Governance',obj:'Change set: '+c.name,field:'State',before:'In review',after:'Approved'});emit('cs-approved');toast('Approved. It can be published now.');rerender()};
A.csReturn=id=>{const c=csOf(id);c.state='Open';c.comments.push({by:me().name,text:'Please keep “Manage enquiries” at Team scope.'});toast('Returned to the author with a comment');rerender()};
A.csSchedule=id=>{const c=csOf(id);c.state='Scheduled';c.when='16 Oct 2026, 06:00';toast('Scheduled for 16 Oct 2026, 06:00');rerender()};
A.csDiscard=id=>confirmDlg('Discard this change set?','<p>Nothing in it will be applied.</p>','Discard',()=>{const c=csOf(id);c.items.slice().reverse().forEach(i=>i.revert&&i.revert());c.state='Discarded';toast('Discarded');go('#/governance/review')},true);
A.csPublish=id=>{const c=csOf(id);if(c.items.some(i=>i.sensitive)&&c.state!=='Approved'&&c.state!=='Scheduled'){toast('This change set needs approval first','err');return}
 c.state='Published';c.published=now();c.items.forEach(i=>{logIt(i,c.name);if(i.role){i.role.published=true;i.role.sandboxOnly=false}});
 if(c.env==='sandbox'){S.env='live'}emit('cs-published');toast(`${c.name} published to live`,'',['Open change log','#/governance/changelog']);rerender()};
A.rollback=name=>{const c=S.changeSets.find(x=>x.name===name);if(!c)return;
 confirmDlg('Roll back this change set?',`<p>A new change set reverses all ${c.items.length} changes in <b>${esc(c.name)}</b> and is recorded in the change log. The previous values are restored within five minutes.</p>`,'Roll back',()=>{
  c.items.slice().reverse().forEach(i=>i.revert&&i.revert());c.state='Rolled back';
  const rb={id:'cs'+(S.changeSets.length+101),name:'Rollback of '+c.name,state:'Published',author:me().name,env:'live',items:c.items.map(i=>({area:i.area,obj:i.obj,field:i.field,before:i.after,after:i.before})),created:now(),comments:[]};
  S.changeSets.push(rb);rb.items.forEach(i=>logIt(i,rb.name));emit('cs-rolledback');toast('Rolled back. Previous values restored.');rerender()},true)};

 const s=S.ui.surface||'web';
 const tabs=`<div class="segc" style="margin-bottom:10px">${[['web','Marketplace'],['email','Email'],['pdf','PDF'],['app','App']].map(([k,l])=>`<button data-act="surf" data-arg="${k}" aria-pressed="${s===k}">${l}</button>`).join('')}</div>`;
 const L=S.listings[3]||genListings()[3];
 const body=s==='web'?miniSite({compact:true}):s==='email'?`<div class="mail" style="--brand:${S.brand.primary}"><div class="mh">${S.brand.logo?logoSvg(true,22):'Northwind Used'}</div><div class="mb"><b>New enquiry for ${L.make} ${L.model}</b><p style="margin:8px 0">Mark Richter from Kessler Tiefbau is interested in your machine.</p><span class="cta">Reply to enquiry</span></div><div class="mf">${esc(S.brand.emailFooter)}</div></div>`
  :s==='pdf'?`<div class="pdf" style="--brand:${S.brand.primary}"><div class="ph2"><span>${S.brand.logo?logoSvg(false,20):'Northwind'}</span><span style="font-weight:500">Spec sheet</span></div><div style="height:90px;background:linear-gradient(135deg,#C9D2CF,#E8ECEA);border-radius:3px;margin-bottom:8px"></div><b style="font-size:13px">${L.make} ${L.model} (${L.year})</b><table style="width:100%;margin-top:6px;border-collapse:collapse">${[['Hours',nf(L.hours)+' h'],['Operating weight','24.8 t'],['Location',L.country],['Price',eur(L.price)]].map(r=>`<tr><td style="border-bottom:1px solid #E3E8E6;padding:3px 0;color:#5B6B70">${r[0]}</td><td style="border-bottom:1px solid #E3E8E6;padding:3px 0;text-align:right;font-weight:600">${r[1]}</td></tr>`).join('')}</table>${S.brand.pdfQr?`<div style="margin-top:10px;display:flex;gap:8px;align-items:center"><div style="width:42px;height:42px;background:repeating-conic-gradient(#17252B 0 25%,#fff 0 50%) 0 0/8px 8px"></div><small>Scan for the live listing</small></div>`:''}</div>`
  :`<div class="phone" style="--brand:${S.brand.primary};height:470px"><div class="notch"><span>9:41</span><span></span></div><div class="scr"><div style="margin:6px 0 10px">${S.brand.logo?logoSvg(false,22):''}</div><div class="btnb">Browse machines</div><div class="blk"><h5>${L.make} ${L.model}</h5>${eur(L.price)}</div></div>${phoneTabs(['Explore','Saved','Enquiries','Listings','Profile'])}</div>`;
 return `<div class="sticky">${tabs}${body}<p class="muted" style="font-size:12px;margin-top:8px">One set of design tokens drives the marketplace, CMS pages, emails, PDFs and both apps.</p></div>`;
}
A.surf=k=>{S.ui.surface=k;rerender()};
function brandPage(title,sub,inner){return {title,sub,body:`<div class="split wide"><div>${inner}</div>${brandPreview()}</div>`}}
V['branding/identity']=()=>brandPage('Identity','Logos, favicon and login background.',`<div class="panel"><div class="pb">${[['logo','Logo for light backgrounds','SVG or PNG, displayed up to 400 × 120 px',false],['logoDark','Logo for dark backgrounds','Used on the email header and dark app screens',true],['compact','Compact logo','For tight spaces such as the app header',false],['favicon','Favicon','512 px square',false]].map(([k,l,h,dark])=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="logo-prev" style="width:200px;${dark?'background:var(--brand);border-radius:5px;padding:0 8px;--brand:'+S.brand.primary:''}">${S.brand[k]?logoSvg(dark,30):'<span class="muted">Not set</span>'}</div><span style="flex:1"><b>${l}</b><br><small>${h}</small></span><label class="btn sm mut">Upload<input type="file" class="sr" accept=".svg,.png" data-ch="uploadLogo"></label>${S.brand[k]?'':`<button class="btn sm ghost mut" data-act="sampleLogo">Use sample</button>`}</div>`).join('')}
 <div class="row" style="padding:12px 0"><div style="width:200px;height:60px;border-radius:5px;background:linear-gradient(120deg,#5B6B70,#C9D2CF)"></div><span style="flex:1"><b>Login background image</b><br><small>1920 × 1080 recommended</small></span><button class="btn sm mut">Replace</button></div></div></div>`);
V['branding/colours']=()=>{const keys=[['primary','Primary','Buttons, links, hero backgrounds'],['secondary','Secondary','Headers, footers'],['accent','Accent','Badges and highlights'],['neutral','Neutral scale base','Borders and muted text'],['success','Success'],['warning','Warning'],['error','Error'],['info','Info']];
 return brandPage('Colours','Contrast is checked against WCAG 2.1 AA. A pair that fails for body text can’t be saved without an explicit override.',`<div class="panel"><div class="pb">${keys.map(([k,l,h])=>{const c=S.brand[k];const r=ratio(c,'#FFFFFF');const ok=r>=4.5;return `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap"><input type="color" value="${c}" data-ch="brandColor" data-arg="${k}" aria-label="${l} colour" style="width:44px;height:36px;border:1px solid var(--line-2);border-radius:6px;background:none;flex:none"><span style="flex:1"><b>${l}</b> <code>${c}</code><br><small>${h||''}</small></span><span class="contrast" style="color:var(--${ok?'ok':'warn'})">${ic(ok?'check':'warn')} ${r.toFixed(1)}:1 with white</span></div>`}).join('')}
 <label class="row" style="margin-top:12px"><input type="checkbox" id="ovr" ${S.ui.ovr?'checked':''} data-ch="ovr"> Allow colours that fail AA for body text (override)</label></div></div>`)};
A.ovr=(a,el)=>{S.ui.ovr=el.checked};
A.brandColor=(k,el)=>{const v=el.value;const b=S.brand[k];
 if(['primary','secondary'].includes(k)&&ratio(v,'#FFFFFF')<4.5&&!S.ui.ovr){el.value=b;dlg('This colour fails contrast',`<div class="note err">${ic('warn')}<span>White text on <code>${v}</code> has a contrast of ${ratio(v,'#FFFFFF').toFixed(2)}:1. Body text needs 4.5:1.</span></div><p>Try a darker shade such as <code>${darken(v)}</code> (${ratio(darken(v),'#FFFFFF').toFixed(2)}:1), or tick the override if you accept the risk.</p>`,`<button class="btn" data-act="closeDlg">Cancel</button><button class="btn pri" data-act="useShade" data-arg="${k}|${darken(v)}">Use ${darken(v)}</button>`);return}
 S.brand[k]=v;if(k==='primary')document.documentElement.style.setProperty('--brand',v);savedToast(change({area:'Branding',obj:'Theme',field:k[0].toUpperCase()+k.slice(1)+' colour',before:b,after:v,revert:()=>S.brand[k]=b}),'Colour');rerender()};
A.useShade=arg=>{const [k,v]=arg.split('|');$('#dlg').close();const b=S.brand[k];S.brand[k]=v;savedToast(change({area:'Branding',obj:'Theme',field:k+' colour',before:b,after:v,revert:()=>S.brand[k]=b}),'Colour');rerender()};
function darken(h){let [r,g,b]=hexRgb(h).map(x=>x*255);let i=0;let out=h;while(ratio(out,'#FFFFFF')<4.6&&i<30){r*=.9;g*=.9;b*=.9;out='#'+[r,g,b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');i++}return out.toUpperCase()}
V['branding/typography']=()=>brandPage('Typography','Fonts from the library or uploaded WOFF2 files. A fallback stack is required.',form('typo',S.brand,[{h:'Typography',fields:[{k:'heading',label:'Heading font',type:'select',options:['Archivo','Source Sans 3','IBM Plex Sans','Upload WOFF2…']},{k:'body',label:'Body font',type:'select',options:['Archivo','Source Sans 3','IBM Plex Sans']},{k:'base',label:'Base size',suffix:'px'},{k:'scale',label:'Heading scale',type:'select',options:['1.2','1.25','1.333']},{type:'static',label:'Fallback stack',html:'<code>system-ui, -apple-system, Segoe UI, Roboto, sans-serif</code>'}]}],{area:'Branding',obj:'Theme'}));

V['branding/icons']=()=>brandPage('Icons','Category icons come from Catalog and are recoloured by the theme.',`<div class="panel"><div class="pb"><div class="cards3" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${S.taxonomy.filter(n=>n.level==='Category').map(n=>`<div class="mcard" style="align-items:center;padding:12px;gap:4px"><span style="color:${S.brand.primary}">${ic('excav')}</span><small>${n.name.en}</small></div>`).join('')}</div><div class="fld" style="margin-top:14px"><label>Interface icon set ${relB('P1')}</label><select class="in" ${P1()?'':'disabled'}><option>Outline</option><option>Solid</option></select></div></div></div>`);
V['branding/documents']=()=>brandPage('Documents','PDF spec sheet and email header and footer. Fields are chosen from templates.',form('docs',S.brand,[{h:'PDF spec sheet',fields:[{k:'pdfHeader',label:'Header',type:'select',options:['Logo and contact','Logo only']},{k:'pdfFields',label:'Fields shown'},{k:'pdfQr',label:'QR code to the listing',type:'toggle'}]},{h:'Offer letter',rel:'P1',fields:[{k:'offer',label:'Template',type:'select',options:['Standard offer letter']}]},{h:'Email',fields:[{k:'emailHeader',label:'Header',type:'select',options:['Logo on primary','Logo on white']},{k:'emailFooter',label:'Footer'}]}],{area:'Branding',obj:'Documents'}));
V['branding/domains']=()=>({title:'Domains',sub:'Connect a domain per marketplace: enter it, add the DNS records, and we verify it and issue a certificate automatically.',
 actions:S.marketplaces.length?`<button class="btn pri mut" data-act="connectDomain">${ic('plus')}Connect domain</button>`:'',
 body:S.domains.length?`<div class="tw"><table class="t"><thead><tr><th>Domain</th><th>Marketplace</th><th>Status</th><th>Primary</th><th>Certificate</th></tr></thead><tbody>${S.domains.map(d=>`<tr><td><b>${d.host}</b></td><td>${d.mp}</td><td><span class="chip ${d.status==='Verified'?'ok':d.status==='Failing'?'err':'warn'}">${d.status}</span></td><td>${d.primary?'Yes':''}</td><td>${d.status==='Verified'?'Valid until 12 Jan 2027':'—'}</td></tr>`).join('')}<tr><td>www.used.northwind-equipment.com</td><td>Northwind Used</td><td><span class="chip plain">Redirect</span></td><td></td><td>To primary</td></tr></tbody></table></div>`:`<div class="panel"><div class="empty"><h3>No custom domains yet</h3><p>Your marketplaces use a Krank sub-domain until you connect one.</p>${S.marketplaces.length?'<button class="btn pri" data-act="connectDomain">Connect domain</button>':''}</div></div>`});

 return brandPage('Partner sub-branding',isP?'Your logo and cover image on Hughes Plant listings. Assets are checked for size and format.':'Show each partner’s logo and contact on its own listings.',isP?`<div class="panel"><div class="pb"><div class="row"><div class="logo-prev" style="width:200px"><b style="font-stretch:80%;font-size:20px;color:#9A3412">HUGHES PLANT</b></div><label class="btn sm">Upload logo<input type="file" class="sr" data-ch="noopFile"></label></div><div class="row" style="margin-top:12px"><div style="width:200px;height:60px;background:linear-gradient(120deg,#9A3412,#F5C69B);border-radius:5px"></div><label class="btn sm">Upload cover image<input type="file" class="sr" data-ch="noopFile"></label></div>${P1()?'<p class="muted" style="margin-top:12px">Changes need Northwind Equipment’s approval.</p>':''}</div></div>`
  :form('sub',S.brand,[{h:'Sub-branding',fields:[{k:'subShow',label:'Show partner logo and contact on its listings',type:'toggle'},{k:'subUpload',label:'Partners may upload logo and cover image',type:'toggle'}]}],{area:'Branding',obj:'Partner sub-branding'}))};
